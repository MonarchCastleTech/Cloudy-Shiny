name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify product contracts
        run: |
          node --test tests/*.test.mjs
          python -m unittest tests.test_product_contract
          test -s index.html
          test -s logo.png
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live page
        shell: bash
        run: |
          for attempt in {1..6}; do
            if curl --fail --silent --show-error --location --max-time 20 "${{ steps.deployment.outputs.page_url }}" | grep -q "Cloudy&amp;Shiny Index"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
